# En-têtes du README-ARCADE.md. PAS de frame-ancestors ni de X-Frame-Options :
# cet éditeur est fait pour être encadré par Arcade.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header Permissions-Policy "camera=(), microphone=(self)" always;

  # Aucune réécriture d'adresse : la plateforme demande `editor.html`, et un
  # serveur qui le réécrirait en `/editor` casserait le cadre sans rien dire.
  location ~* \.html$ {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "camera=(), microphone=(self)" always;
  }

  location ~ ^/(js|static|images)/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "camera=(), microphone=(self)" always;
  }
}
